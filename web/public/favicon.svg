<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="biliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEC" />
      <stop offset="50%" stop-color="#FB7299" />
      <stop offset="100%" stop-color="#FF5D8F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FB7299" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#12131C" />
  <rect x="15" y="24" width="70" height="52" rx="14" fill="url(#biliGrad)" filter="url(#glow)" />
  <!-- 天線 -->
  <line x1="28" y1="12" x2="38" y2="24" stroke="#00AEEC" stroke-width="5" stroke-linecap="round" />
  <line x1="72" y1="12" x2="62" y2="24" stroke="#FB7299" stroke-width="5" stroke-linecap="round" />
  <!-- 眼睛 -->
  <circle cx="38" cy="50" r="5.5" fill="#FFFFFF" />
  <circle cx="62" cy="50" r="5.5" fill="#FFFFFF" />
  <!-- 小嘴巴 -->
  <path d="M46 56 Q50 60 54 56" fill="transparent" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
</svg>
